<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            min-height: 100vh;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            display: flex;
            /* flex-direction: column; */
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        form {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        option {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        button {
            background-color: #bd2222;
            color: white;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin: 10px;
        }

        h2 {
            text-align: center;
        }
        #debit{
            background-color: green;
        }
        .debit{
            color: green;
        }
        .expense {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .list-item {
            background-color: pink;
            width: 40vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .list-item p {
            margin: 0;
            width: 60px;
            text-align: center;
            background-color: rgb(244, 238, 238);
            padding: 15px;
            border-radius: 5px;
        }
        .credit{
            color: red;
        }
        .list-item button {
            background-color: red;
            color: white;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc
        }
        .sum{
            background-color: goldenrod;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <form action="submit">
            <h2>Expense Tracker</h2>
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter Amount" required>
            <br>
            <label for="ename">Description</label>
            <input type="text" id="ename" placeholder="Enter Description" required>
            <br>
            <label for="category">Category</label>
            <select name="category" id="category">
                <option value="food">Food</option>
                <option value="travel">Travel</option>
                <option value="shopping">Shopping</option>
                <option value="entertainment">Entertainment</option>
            </select>
            <br>
            <button id="debit">Cash In</button>
            <button id="submit">Cash out</button>
        </form>
        <div class="expense">
            <div id="list"></div>
            <button onclick="reset()">Reset</button>
        </div>
    </div>
    <div id="total"></div>
    <script src="script.js"></script>
</body>

</html>
